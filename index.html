<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fietsencatalogus — Nieuwsbrief Dashboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--navy:#2e4a65;--navy-soft:#3e6187;--navy-deep:#22384d;--on-navy:#F7F5F1;
--acc:#ec6661;--acc-soft:#f4938f;
--paper:#F7F6F3;--surface:#FFFEFC;--surface-tint:#FBFBFA;--surface-deep:#F2F1ED;
--ink:#151E29;--ink-soft:#2C3B4C;--mute:#787774;--mute-soft:#9B9A97;
--hair:#EAEAEA;--hair-strong:#D6D5D1;
--blue-bg:#E1F3FE;--blue-ink:#1F6C9F;
--green-bg:#EDF3EC;--green-ink:#346538;
--acc-bg:#FDEAE8;--acc-ink:#B03F3B;
--purple-bg:#F2E9F7;--purple-ink:#6B3D8C;
--sage-bg:#ECEFE7;--sage-ink:#4A5A3A;
--amber-bg:#FBF0DC;--amber-ink:#8A6220;
--pri:#2e4a65;--pri-l:#EDF1F5;--pri-h:#22384d;
--dk:#2e4a65;--tx:#151E29;--mt:#787774;--bd:#EAEAEA;--bg:#F7F6F3;--cd:#FFFEFC;--ch:#FBFBFA;--ft:#F2F1ED;
--gn:#346538;--gn-l:#EDF3EC;--am:#8A6220;--am-l:#FBF0DC;
--r:8px;--rl:12px;--rxl:16px;--pill:100px;
--ff:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
--fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
--sh-float:0 12px 40px rgba(21,30,41,.12);--sh-modal:0 24px 64px rgba(21,30,41,.25);--shm:0 12px 40px rgba(21,30,41,.12);
--sb-w:264px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff);background:var(--paper);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
::selection{background:var(--acc-bg);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:var(--hair-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:100px;border:3px solid var(--paper)}
*::-webkit-scrollbar-thumb:hover{background:var(--mute-soft)}
input,textarea,select,[contenteditable]{caret-color:var(--acc)}
input[type=checkbox],input[type=radio]{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
a{color:var(--navy);text-underline-offset:3px}
.num,.tnum{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:flex;align-items:flex-start;min-height:100vh}
.sidebar{flex-shrink:0;width:var(--sb-w);background:var(--navy);color:var(--on-navy);margin:14px;border-radius:var(--rxl);padding:20px 14px 16px;position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;gap:4px;z-index:40}
/* sidebar: de grammatica van Technetium Talent, op FC-navy */
.sidebar{--sb-ink:rgba(255,255,255,.94);--sb-mute:rgba(255,255,255,.55);--sb-line:rgba(255,255,255,.10);--sb-hover:rgba(255,255,255,.07)}
.side-logo{display:flex;align-items:center;gap:11px;padding:0 10px;margin-bottom:20px;color:var(--sb-ink);font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.03em}
.logo-plate{display:inline-flex;align-items:center;height:34px;flex-shrink:0;color:var(--sb-ink);font-weight:700;font-size:13px}
.logo-plate img{height:26px;width:auto;display:block}
.side-group{font-family:var(--fm);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sb-mute);padding:0 10px;margin:2px 0 10px}
.side-menu{display:flex;flex-direction:column;gap:3px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;min-height:42px;border-radius:10px;border:none;background:transparent;color:var(--sb-mute);font-family:var(--ff);font-size:13.5px;font-weight:500;letter-spacing:-.005em;text-align:left;cursor:pointer;transition:background .18s cubic-bezier(.2,.8,.3,1),color .18s}
.sb-item:hover{background:var(--sb-hover);color:var(--sb-ink)}
.sb-item.act{background:var(--paper);color:var(--ink);font-weight:600}
.sb-item svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.6;opacity:.75}
.sb-item.act svg{opacity:1}
.sb-item .badge{margin-left:auto;font-family:var(--fm);font-size:10.5px;font-weight:500;background:rgba(255,255,255,.13);color:var(--sb-ink);padding:1px 8px;border-radius:var(--pill);line-height:1.5}
.sb-item.act .badge{background:var(--surface-deep);color:var(--mute)}
.side-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--sb-line);display:flex;flex-direction:column;gap:3px}
.side-bottom .sel{width:100%;min-width:0;padding:10px 12px;min-height:40px;border-radius:10px;border:1px solid var(--sb-line);background:rgba(255,255,255,.04);color:var(--sb-ink);font-family:var(--fm);font-size:11px;letter-spacing:.04em;font-weight:500;transition:border-color .18s}
.side-bottom .sel:hover,.side-bottom .sel:focus{border-color:rgba(255,255,255,.25)}
.side-bottom .sel option{background:var(--navy);color:var(--on-navy)}
.side-bottom .mhint{display:block;margin-top:6px;font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--acc-soft);padding:0 10px;font-weight:500}
.sb-x{display:none}
.sb-ov{display:none}

.shell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:26px 28px 0;background:none;height:auto}
.tb-l{display:flex;align-items:center;gap:12px;min-width:0}
.tb-logo{display:none}
.tb-div{display:none}
.tb-title{font-size:22px;font-weight:700;letter-spacing:-.035em;color:var(--ink);line-height:1.15}
.tb-r{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.burger{display:none;width:38px;height:38px;border:1px solid var(--hair);background:var(--surface);border-radius:var(--r);align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.burger svg{width:17px;height:17px;stroke-width:1.6}
.main-c{flex:1;min-width:0;padding:22px 28px 44px;max-width:1160px}
#s-ed,#s-pv{max-width:880px}

/* ---------- buttons ---------- */
.tb,.tb-pri,.tb-gn,.btn-bk,.ar-btn,.lnk,.ov-clear{font-family:var(--ff)}
.tb{background:var(--surface);border:1px solid var(--hair);color:var(--ink);padding:9px 18px;border-radius:var(--pill);font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:border-color .16s,background .16s}
.tb:hover{border-color:var(--hair-strong);background:var(--surface-tint)}
.tb-pri{background:var(--surface);border:1px solid var(--hair-strong);color:var(--ink);padding:9px 18px;border-radius:var(--pill);font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:background .16s,border-color .16s}
.tb-pri:hover{background:var(--surface-tint);border-color:var(--ink)}
#btn-dz{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
#btn-dz:hover{background:var(--navy-soft)}
.tb-gn{background:var(--navy);border:1px solid var(--navy);color:var(--on-navy);padding:9px 20px;border-radius:var(--pill);font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:background .16s}
.tb-gn:hover{background:var(--navy-soft)}
.tb:active,.tb-pri:active,.tb-gn:active,.ar-btn:active,.btn-bk:active{transform:scale(.98)}
.btn-bk{background:none;border:1px solid var(--hair-strong);color:var(--ink);padding:8px 16px;border-radius:var(--pill);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .16s}
.btn-bk:hover{background:var(--surface-tint)}
.lnk{background:none;border:none;color:var(--navy);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--ff);text-decoration:none;padding:0}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- toast ---------- */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-10px);padding:12px 22px;border-radius:var(--pill);background:var(--navy);color:var(--on-navy);font-size:13px;font-weight:600;letter-spacing:-.01em;box-shadow:var(--sh-float);opacity:0;pointer-events:none;transition:opacity .22s cubic-bezier(.2,.8,.3,1),transform .22s cubic-bezier(.2,.8,.3,1);z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--acc-ink)}

/* ---------- page header ---------- */
.eh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:24px}
.eh h2{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.eh p{color:var(--mute);font-size:13px;margin-top:5px}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.fbar-l{display:flex;align-items:center;gap:10px}
.fbar-l label{font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mute)}
.mhint{font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-bg);padding:5px 11px;border-radius:var(--pill)}

/* ---------- inputs ---------- */
.sel{padding:9px 14px;border:1px solid var(--hair);border-radius:var(--r);font-family:var(--ff);font-size:13px;font-weight:600;background:var(--surface);color:var(--ink);cursor:pointer;outline:none;min-width:200px;transition:border-color .16s}
.sel:focus{border-color:var(--ink)}
.fl{display:block;font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin-bottom:7px}
.fl:not(:first-child){margin-top:20px}
.fi{width:100%;padding:12px 16px;border:1px solid var(--hair);border-radius:var(--r);font-family:var(--ff);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);outline:none;transition:border-color .16s}
.fi:focus{border-color:var(--ink)}
.fi.sm{font-size:13.5px;font-weight:400}
.fi::placeholder,.ft2::placeholder{color:var(--mute-soft)}
.ft2{width:100%;padding:13px 16px;border:1px solid var(--hair);border-radius:var(--r);font-family:var(--ff);font-size:13.5px;line-height:1.7;color:var(--ink-soft);background:var(--surface);outline:none;resize:vertical;min-height:120px;transition:border-color .16s}
.ft2:focus{border-color:var(--ink)}
.stbox{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--pill)}
.stbox label{font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mute)}
.stbox select{border:none;background:transparent;font-family:var(--ff);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;outline:none;padding:2px 4px}

/* ---------- rich text ---------- */
.rte-wrap{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:var(--surface);transition:border-color .16s}
.rte-wrap:focus-within{border-color:var(--ink)}
.rte-tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;background:var(--surface-tint);border-bottom:1px solid var(--hair)}
.rte-tb button{background:var(--surface);border:1px solid var(--hair);border-radius:var(--pill);min-width:32px;height:30px;padding:0 11px;font-family:var(--ff);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color .14s,background .14s}
.rte-tb button:hover{border-color:var(--hair-strong);background:var(--surface-tint)}
.rte{min-height:120px;padding:14px 16px;font-family:var(--ff);font-size:13.5px;line-height:1.7;color:var(--ink-soft);outline:none}
.rte:empty:before{content:attr(data-ph);color:var(--mute-soft)}
.rte a{color:var(--navy)}
.rte ul{margin:8px 0;padding-left:22px}

/* ---------- bento statistieken ---------- */
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--rl);overflow:hidden;margin-bottom:24px}
.sc{background:var(--surface);padding:18px 20px}
.sc-l{font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin-bottom:10px}
.sc-v{font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.sc-s{font-size:12px;color:var(--mute);margin-top:6px}
.sc.clk{cursor:pointer;transition:background .16s}
.sc.clk:hover{background:var(--surface-tint)}
.sc.clk.act{background:var(--paper);box-shadow:inset 0 2px 0 0 var(--acc)}

/* ---------- tabel ---------- */
.tw{background:var(--surface);border-radius:var(--rl);border:1px solid var(--hair);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);text-align:left;padding:13px 18px;background:var(--surface-tint);border-bottom:1px solid var(--hair)}
td{padding:14px 18px;border-bottom:1px solid var(--hair);font-size:13.5px;color:var(--ink-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-tint)}

/* ---------- overzicht ---------- */
.ov-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
.ov-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:var(--pill);border:1px solid var(--hair);background:var(--surface);font-family:var(--ff);font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink-soft);cursor:pointer;transition:border-color .16s,background .16s;min-height:38px}
.ov-chip:hover{border-color:var(--hair-strong);background:var(--surface-tint)}
.ov-chip.act{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ov-chip-c{font-family:var(--fm);font-size:10.5px;font-weight:500;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.ov-chip.act .ov-chip-c{color:rgba(247,246,243,.7)}
.ov-clear{background:none;border:none;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--ff);text-decoration:underline;text-underline-offset:3px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ov-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--rl);padding:18px 20px;cursor:pointer;transition:border-color .16s}
.ov-card:hover{border-color:var(--hair-strong)}
.ov-card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ov-card-h>div:first-child{min-width:0;flex:1 1 auto}
.ov-card-n{overflow-wrap:anywhere;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3;color:var(--ink)}
.ov-card-id{font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--mute);margin-top:5px}
.ov-card-b{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:10px;padding-top:13px;border-top:1px solid var(--hair)}
.ov-meta{font-size:12.5px;color:var(--mute)}
.ov-meta strong{color:var(--ink);font-weight:600}
.ov-empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--mute);font-size:13.5px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--rl)}
/* wacht op de redactie: het enige coral-signaal in het rooster */

/* ---------- statuskiezer ---------- */
.ov-status-wrap{position:relative;display:inline-block;margin-left:auto}
.ov-status-btn{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--pill);border:1px solid transparent;font-family:var(--fm);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;transition:filter .16s;white-space:nowrap}
.ov-status-btn:hover{filter:brightness(.97)}
.ov-status-btn:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ov-status-pop{position:absolute;top:calc(100% + 7px);right:0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--rl);box-shadow:var(--sh-float);padding:6px;z-index:60;min-width:210px;display:none}
.ov-status-pop.show{display:block}
.ov-status-opt{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;background:none;border:none;border-radius:var(--r);font-family:var(--ff);font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;text-align:left;transition:background .14s}
.ov-status-opt:hover{background:var(--surface-tint)}

/* ---------- statuspils (pastelparen) ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--pill);font-family:var(--fm);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.p-con{background:var(--surface-deep);color:var(--mute)}
.p-goe{background:var(--green-bg);color:var(--green-ink)}
.p-ver{background:var(--green-bg);color:var(--green-ink)}
.p-afg{background:var(--surface-deep);color:var(--mute-soft)}
.p-wac{background:var(--blue-bg);color:var(--blue-ink)}
.p-bew{background:var(--purple-bg);color:var(--purple-ink)}
/* statuskleur hoort bij de knop, nooit bij de hele kaart */
.ov-status-btn.s-wacht_op_keuze,.ov-status-opt.s-wacht_op_keuze{background:var(--surface-deep);color:var(--mute)}
.ov-status-btn.s-keuze_ontvangen,.ov-status-opt.s-keuze_ontvangen{background:var(--blue-bg);color:var(--blue-ink)}
.ov-status-btn.s-bewerkt,.ov-status-opt.s-bewerkt{background:var(--purple-bg);color:var(--purple-ink)}
.ov-status-btn.s-wacht_op_susanne,.ov-status-opt.s-wacht_op_susanne{background:var(--acc-bg);color:var(--acc-ink)}
.ov-status-btn.s-wacht_op_winkel,.ov-status-opt.s-wacht_op_winkel{background:var(--sage-bg);color:var(--sage-ink)}
.ov-status-btn.s-verzonden,.ov-status-opt.s-verzonden{background:var(--green-bg);color:var(--green-ink)}
.ov-status-btn.s-overslaan,.ov-status-opt.s-overslaan{background:var(--surface-deep);color:var(--mute-soft)}
/* de kaart zelf blijft dossierblad; alleen wie op de redactie wacht krijgt een 1px coral rand */
.ov-card.s-wacht_op_susanne{border-color:var(--acc)}
.ov-card.s-overslaan{opacity:.5}

/* ---------- keuzekaarten ---------- */
.kc{background:var(--surface);border-radius:var(--rl);border:1px solid var(--hair);margin-bottom:12px;overflow:hidden}
.kc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;background:var(--surface-tint);border-bottom:1px solid var(--hair)}
.kc-wn{font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.kc-dt{font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kc-b{padding:6px 20px 14px}
.ki{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
.ki:last-child{border-bottom:none}
.ki-n{font-family:var(--fm);font-size:10px;font-weight:500;color:var(--mute);padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ki-c{flex:1;min-width:0}
.ki-t{font-size:13.5px;font-weight:600;line-height:1.45;color:var(--ink)}
.ki-s{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.55}
.ki-inf{font-family:var(--ff);font-size:13.5px;letter-spacing:-.005em;text-transform:none;color:var(--ink);margin-top:0}
.ki-inf .ki-t{display:block}
.ki-c.ei{display:inline-block;font-family:var(--fm);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-soft);margin:2px 0 4px;flex:none}
.ki-n.ei{border:none;background:none;width:auto;min-width:0}
.ki-n.ai{color:var(--green-ink)}
.ki-c.ei.ai{background:var(--green-bg);color:var(--green-ink);padding:2px 8px;border-radius:var(--pill)}

/* ---------- accordeon (editor) ---------- */
.ac{background:var(--surface);border-radius:var(--rl);border:1px solid var(--hair);margin-bottom:12px;overflow:hidden}
.ah{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;cursor:pointer;background:var(--surface-tint);border-bottom:1px solid var(--hair);transition:background .16s}
.ah:hover{background:var(--surface-deep)}
.ah.col{border-bottom:none;background:var(--surface)}
.ah-l{display:flex;align-items:center;gap:11px;min-width:0}
.an{width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;font-weight:500;flex-shrink:0}
.at{font-size:14px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
.ah-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.bd2{background:none;border:none;color:var(--mute);cursor:pointer;font-size:15px;padding:4px 8px;border-radius:var(--pill);transition:background .14s,color .14s}
.bd2:hover{color:var(--acc-ink);background:var(--acc-bg)}
.cv{color:var(--mute);font-size:15px;transition:transform .2s cubic-bezier(.2,.8,.3,1);display:inline-block}
.cv.op{transform:rotate(180deg)}
.ab{padding:20px}
.btn-ad{width:100%;padding:17px;background:var(--surface);border:1px dashed var(--hair-strong);border-radius:var(--rl);color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:border-color .16s,color .16s,background .16s;margin-bottom:12px}
.btn-ad:hover{border-color:var(--navy);color:var(--navy);background:var(--surface-tint)}

/* ---------- afbeelding ---------- */
.imgrow{display:flex;gap:16px;align-items:flex-start;margin-top:18px}
.imgrow-l{flex:1;min-width:0}
.imgrow-l .fl{margin-top:0}
.ip-side{flex-shrink:0;width:160px;height:160px;border:1px solid var(--hair);border-radius:var(--r);background:var(--surface-deep);display:flex;align-items:center;justify-content:center;overflow:hidden;align-self:flex-end;margin-bottom:1px}
.ip-side img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:pointer}
.ip-side .empty{font-size:11px;color:var(--mute);text-align:center;padding:10px;line-height:1.5}
.ip-side button.dbx{background:var(--surface);color:var(--navy);border:1px dashed var(--hair-strong);border-radius:var(--pill);padding:7px 13px;font-family:var(--ff);font-size:11.5px;font-weight:600;cursor:pointer;margin-top:8px}
.ip-side button.dbx:hover{border-color:var(--navy);background:var(--pri-l)}

/* ---------- preview ---------- */
.pw{background:var(--surface-deep);padding:22px;border-radius:var(--rxl);border:1px solid var(--hair)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ph h2{font-size:19px;font-weight:700;letter-spacing:-.03em}
.pb{font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);background:var(--surface);padding:6px 12px;border-radius:var(--pill);border:1px solid var(--hair)}
.ef{background:var(--surface);max-width:600px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;color:#3b3f44;font-size:16px;line-height:1.5;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-float)}

/* ---------- cijferkaarten ---------- */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.cc{background:var(--surface);border-radius:var(--rl);padding:20px;border:1px solid var(--hair)}
.cc h3{font-size:13.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:16px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.br:last-child{margin-bottom:0}
.bl2{width:90px;font-family:var(--fm);font-size:10px;letter-spacing:.08em;color:var(--mute);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:22px;background:var(--surface-deep);border-radius:var(--pill);overflow:hidden;position:relative}
.bf{height:100%;border-radius:var(--pill);transform-origin:left center;transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.bv{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--fm);font-size:9.5px;font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- artikelen ---------- */
.ar-fb{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.ar-fb button{padding:8px 16px;border-radius:var(--pill);border:1px solid var(--hair);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:border-color .16s,background .16s;min-height:38px}
.ar-fb button:hover{border-color:var(--hair-strong);background:var(--surface-tint)}
.ar-fb button.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ar-cd{background:var(--surface);border-radius:var(--rl);border:1px solid var(--hair);margin-bottom:12px;padding:20px;transition:border-color .16s}
.ar-cd:hover{border-color:var(--hair-strong)}
.ar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:11px}
.ar-ti{font-size:15.5px;font-weight:700;letter-spacing:-.025em;line-height:1.35}
.ar-meta{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.ar-sm{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin-bottom:16px;max-width:72ch}
.ar-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ar-btn{padding:9px 18px;border-radius:var(--pill);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--ff);border:1px solid transparent;transition:background .16s,border-color .16s}
.ar-btn.gk{background:var(--navy);color:var(--on-navy)}
.ar-btn.gk:hover{background:var(--navy-soft)}
.ar-btn.af{background:var(--surface);color:var(--mute);border-color:var(--hair)}
.ar-btn.af:hover{border-color:var(--hair-strong);color:var(--ink)}
.ar-btn:disabled{opacity:.5;cursor:wait}
.ar-url{font-family:var(--fm);font-size:10.5px;color:var(--mute);margin-top:10px;word-break:break-all;letter-spacing:.04em}

/* ---------- foto's ---------- */
.ft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.ft-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:16px}
.ft-card.done{opacity:.45;pointer-events:none}
.ft-name{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.ft-id{font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--mute);margin-top:4px}
.ft-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ft-ph{position:relative;border:1px solid var(--hair);border-radius:var(--r);background:var(--surface-tint);aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:border-color .16s}
.ft-ph:hover{border-color:var(--hair-strong)}
.ft-ph.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.ft-ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ft-ph .ft-chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ft-ph.sel .ft-chk{display:flex}
.ft-ph .ft-zoom{position:absolute;bottom:6px;right:6px;background:rgba(21,30,41,.7);color:var(--on-navy);font-family:var(--fm);font-size:9px;font-weight:500;letter-spacing:.1em;padding:3px 8px;border-radius:var(--pill);text-decoration:none;opacity:0;transition:opacity .16s}
.ft-ph:hover .ft-zoom{opacity:1}
.ft-ph.empty-ph{cursor:default;color:var(--mute-soft);font-size:10.5px;text-align:center;padding:8px}
.ft-acts{display:flex;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--hair);flex-wrap:wrap}

/* ---------- legacy tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--hair)}
.tab{padding:11px 16px;font-size:13px;font-weight:600;color:var(--mute);background:none;border:none;cursor:pointer;font-family:var(--ff);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.act{color:var(--ink);border-bottom-color:var(--acc)}

/* ---------- ingelijst app-frame: donkere lijst, sidebar erin, content als lichter inzetpaneel ---------- */
body{background:var(--surface-deep)}
.app{margin:14px;background:var(--navy);border-radius:20px;padding:10px 10px 10px 0;min-height:calc(100vh - 28px);align-items:stretch}
.sidebar{margin:0;background:transparent;border-radius:0;height:auto;position:sticky;top:24px;align-self:flex-start;max-height:calc(100vh - 48px);padding:14px 14px 10px}
.shell{background:var(--paper);border-radius:14px;min-height:calc(100vh - 48px);border:1px solid rgba(21,30,41,.06)}
.topbar{padding:22px 28px 0}
.main-c{padding:18px 28px 40px;max-width:none}

/* ---------- overzichtskop ---------- */
.ov-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.ov-title{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.15;color:var(--ink);text-transform:capitalize}
.ov-title-sub{color:var(--mute);font-weight:600;text-transform:none}
.ov-lead{color:var(--mute);font-size:13.5px;margin-top:5px}
.ov-lead strong{color:var(--acc-ink);font-weight:700}

/* ---------- statistieken als bento (1px hairline-gaps), elk vak is een filter ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--rl);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:18px 20px 16px;text-align:left;border:none;font-family:var(--ff);cursor:pointer;transition:background .16s;display:block;width:100%}
.stat:hover{background:var(--surface-tint)}
.stat.act{background:var(--paper);box-shadow:inset 0 2px 0 0 var(--acc)}
.stat-label{font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;white-space:nowrap}
.stat-num{font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-delta{font-size:12px;color:var(--mute);margin-left:8px;font-weight:500;letter-spacing:-.005em}
.stat-bar{height:4px;background:var(--surface-deep);border-radius:var(--pill);margin-top:14px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--navy);border-radius:var(--pill);transform-origin:left center}
.stat.act .stat-bar i{background:var(--acc)}

/* ---------- winkeltabel ---------- */
.ov-tw{overflow-x:auto}
.ov-tw table{min-width:560px}
.tr-click{cursor:pointer}
.tr-mine td:first-child{box-shadow:inset 3px 0 0 0 var(--acc-bg)}
.td-name{font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.td-id{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--mute);margin-top:4px}
.td-mute{color:var(--mute)}
.td-act{text-align:right;white-space:nowrap}
.td-act-m{display:none;margin-top:10px}
.td-act>*+*{margin-left:10px}
.td-empty{text-align:center;color:var(--mute);padding:44px 18px}
td.num strong{color:var(--ink);font-weight:600}
.btn-row{background:var(--surface);border:1px solid var(--hair);color:var(--navy);padding:6px 13px;border-radius:var(--pill);font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;transition:border-color .16s,background .16s}
.btn-row:hover{border-color:var(--hair-strong);background:var(--surface-tint)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
.chk.on{color:var(--green-ink)}
.chk-box{width:16px;height:16px;border:1px solid var(--hair-strong);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--on-navy);transition:background .14s,border-color .14s}
.chk-box svg{width:11px;height:11px}
.chk.on .chk-box{background:var(--green-ink);border-color:var(--green-ink)}
.ov-status-wrap{margin-left:0}

@media(max-width:1000px){
 .app{margin:0;padding:0;border-radius:0;background:var(--paper);min-height:auto}
 .shell{border-radius:0;border:none;min-height:100vh}
 .sidebar{background:var(--navy);margin:0;padding-top:18px}
 .stats-grid{grid-template-columns:repeat(2,1fr)}
 .stat:last-child{grid-column:1/-1}
 .ov-head{flex-direction:column}
}
@media(max-width:700px){
 .col-x{display:none}
 .td-act{display:none}
 .td-act-m{display:block}
 .ov-tw table{min-width:0;width:100%}
 .ov-status-btn{letter-spacing:.06em;padding:5px 9px;font-size:9px}
 .ov-tw th,.ov-tw td{padding:12px 12px}
 .ov-tw td:first-child,.ov-tw th:first-child{padding-left:14px}
 .btn-row{padding:6px 11px;font-size:11.5px}
}
@media(max-width:420px){
 .stat{padding:14px 14px 12px}
 .stat-num{font-size:24px}
}

/* ---------- responsive ---------- */
@media(max-width:1000px){
 .app{display:block}
 .sidebar{position:fixed;top:0;left:0;bottom:0;margin:0;height:100vh;border-radius:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);width:280px;z-index:120;padding-top:18px}
 .sidebar.open{transform:translateX(0)}
 .sb-x{display:inline-flex;align-items:center;justify-content:center;position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(247,245,241,.1);border:none;color:var(--on-navy);cursor:pointer}
 .sb-x svg{width:16px;height:16px;stroke-width:1.6}
 .sb-ov{display:block;position:fixed;inset:0;background:rgba(21,30,41,.4);opacity:0;pointer-events:none;transition:opacity .28s;z-index:110}
 .sb-ov.open{opacity:1;pointer-events:auto}
 .burger{display:inline-flex}
 .topbar{position:sticky;top:0;z-index:100;background:rgba(247,246,243,.86);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--hair);padding:11px 16px;min-height:60px}
 .tb-title{font-size:16px}
 .main-c{padding:18px 16px 40px}
 .sr{grid-template-columns:repeat(2,1fr)}
 .ov-grid{grid-template-columns:1fr}
 .ft-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
 .cg{grid-template-columns:1fr}
 .eh{flex-direction:column;align-items:flex-start;gap:12px}
 .at{max-width:170px}
 .imgrow{flex-direction:column}
 .ov-card-h{flex-wrap:wrap}
 .ip-side{width:100%;height:190px;align-self:stretch}
 .topbar{flex-wrap:wrap}
 .tb-r{gap:6px;width:100%;justify-content:flex-start}
 .tb,.tb-pri,.tb-gn{padding:8px 14px;font-size:12.5px}
 .imgrow{align-items:stretch}
 .ft-photos{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){
 .sr{grid-template-columns:1fr}
 .sc-v{font-size:26px}
 .main-c{padding:16px 13px 36px}
 .topbar{padding:10px 13px}
}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

den;background:var(--surface-tint);transition:all .15s" onmouseover="this.style.borderColor=\'var(--pri)\';this.style.transform=\'translateY(-1px)\'" onmouseout="this.style.borderColor=\'var(--bd)\';this.style.transform=\'\'" onclick="pickDbx(\''+esc(f.url).replace(/'/g,"\\'")+'\')"><div style="aspect-ratio:1;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden">'+(f.url?'<img src="'+esc(f.url)+'" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display=\'none\'">':'<span style="color:var(--mt);font-size:10px">geen preview</span>')+'</div><div style="padding:6px 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+esc(f.name)+'">'+esc(f.name)+'</div></div>'}).join("")+'</div>'}body=(!fh&&!ig)?'<div style="padding:40px;text-align:center;color:var(--mt)">Deze map is leeg.</div>':(fh+ig)}var backBtn=DBX.stack.length?'<button onclick="dbxBack()" style="background:none;border:1px solid var(--bd);border-radius:var(--r);padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--ff);color:var(--tx);margin-right:8px">&larr; Terug</button>':'';m.innerHTML='<div style="background:var(--surface);border-radius:var(--rxl);max-width:760px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden"><div style="padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="min-width:0"><h3 style="font-size:15px;font-weight:700">Dropbox media-bibliotheek</h3><div style="font-size:11px;color:var(--mt);margin-top:5px;display:flex;align-items:center;flex-wrap:wrap">'+backBtn+crumb+'</div></div><button onclick="closeDbx()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--mt);padding:0 8px;flex-shrink:0">&times;</button></div><div id="dbx-body" style="overflow-y:auto;flex:1">'+body+'</div></div>';document.body.appendChild(m)}
function pickDbx(url){var i=DBX.artIdx;if(i==null){closeDbx();return}ar[i].image=url;var inp=document.querySelector("#ac-"+i+" .imgrow .fi.sm");if(inp)inp.value=url;uI(i);closeDbx();toast("Afbeelding ingevoegd")}
var FT=[],FT_LOADED=false,FT_FILTER="open";
function loadFt(){var el=document.getElementById("s-ft");if(!FT_LOADED&&el)el.innerHTML='<div style="padding:40px;text-align:center;color:var(--mt);font-size:13px">Foto\'s laden...</div>';fetch(API+"/dashboard-fotos").then(function(r){return r.json()}).then(function(d){if(d.success&&d.data){FT=d.data.map(function(f){return{pid:f.product_id,n:f.fiets,zt:f.zoekterm,f1:f.foto_1,f2:f.foto_2,f3:f.foto_3,k:f.keuze||"1",st:f.status,dt:f.toegevoegd_op,busy:false}})}FT_LOADED=true;rFt();updFtBadge()}).catch(function(){FT_LOADED=true;if(el)el.innerHTML='<div style="padding:40px;text-align:center;color:var(--pri);font-size:13px">Foto\'s laden mislukt. Probeer het opnieuw.</div>'})}
function updFtBadge(){var b=document.getElementById("ft-badge");if(!b)return;var n=FT.filter(function(f){return f.st==="te beoordelen"}).length;if(n>0){b.textContent=n;b.classList.remove("hidden")}else{b.classList.add("hidden")}}
function ftOpen(f){return f.st==="te beoordelen"||f.st==="geen foto gevonden"}
function setFtFilter(x){FT_FILTER=x;rFt()}
function rFt(){var el=document.getElementById("s-ft");if(!el)return;var open=FT.filter(ftOpen),beoordeeld=FT.filter(function(f){return!ftOpen(f)});var lijst=FT_FILTER==="open"?open:FT_FILTER==="klaar"?beoordeeld:FT;var chip=function(key,label,cnt){return'<button class="ov-chip'+(FT_FILTER===key?" act":"")+'" onclick="setFtFilter(\''+key+'\')">'+label+' <span class="ov-chip-c">'+cnt+'</span></button>'};var h='<div class="ov-stats">'+chip("open","Te beoordelen",open.length)+chip("klaar","Beoordeeld",beoordeeld.length)+chip("alle","Alle",FT.length)+'<span style="margin-left:auto;font-size:12px;color:var(--mt)">Goedgekeurde foto\'s worden automatisch geüpload naar het CMS</span></div>';if(lijst.length===0){var emptyMsg=FT_FILTER==="klaar"?"Nog geen beoordeelde fietsen. Zodra je een fiets goedkeurt of overslaat, verschijnt hij hier.":FT_FILTER==="alle"?"Nog geen fietsen. Nieuwe fietsen zonder foto verschijnen hier elke maandagochtend.":"Geen fietsen te beoordelen. Nieuwe fietsen zonder foto verschijnen hier elke maandagochtend.";h+='<div class="ov-empty" style="display:block">'+esc(emptyMsg)+'</div>';el.innerHTML=h;return}h+='<div class="ft-grid">'+lijst.map(function(f){var ph=function(num,url){if(!url)return'<div class="ft-ph empty-ph">Geen foto</div>';var sel=String(f.k)===String(num)?" sel":"";return'<div class="ft-ph'+sel+'" onclick="ftPick(\''+esc(f.pid)+'\','+num+')"><img src="'+esc(url)+'" loading="lazy" onerror="this.parentNode.classList.add(\'empty-ph\');this.outerHTML=\'Foto niet geladen\'"><span class="ft-chk">&check;</span><a class="ft-zoom" href="'+esc(url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">vergroot</a></div>'};var isCustom=String(f.k).indexOf("http")===0;var stPill=ftOpen(f)?"":' <span class="pill '+(f.st==="geupload"?"p-ver":f.st==="goedgekeurd"?"p-goe":f.st==="overgeslagen"?"p-con":"p-afg")+'">'+esc(f.st)+'</span>';return'<div class="ft-card'+(ftOpen(f)?"":" done")+'" id="ftc-'+esc(f.pid)+'"><div><div class="ft-name">'+esc(f.n)+stPill+'</div><div class="ft-id">'+esc(f.pid)+(f.dt?' &middot; gevonden '+esc(f.dt):'')+'</div></div><div class="ft-photos">'+ph(1,f.f1)+ph(2,f.f2)+ph(3,f.f3)+'</div><div><label class="fl" style="margin-top:0">Of eigen foto-URL</label><input class="fi sm" placeholder="https://..." value="'+(isCustom?esc(f.k):"")+'" onchange="ftCustom(\''+esc(f.pid)+'\',this.value)"></div><div class="ft-acts"><button class="ar-btn gk" onclick="ftApprove(\''+esc(f.pid)+'\')"'+(f.busy?" disabled":"")+'>Goedkeuren &amp; uploaden</button><button class="ar-btn af" onclick="ftSkip(\''+esc(f.pid)+'\')"'+(f.busy?" disabled":"")+'>Overslaan</button></div></div>'}).join("")+'</div>';el.innerHTML=h}
function ftFind(pid){return FT.find(function(f){return String(f.pid)===String(pid)})}
function ftPick(pid,num){var f=ftFind(pid);if(!f)return;f.k=String(num);rFt()}
function ftCustom(pid,url){var f=ftFind(pid);if(!f)return;url=(url||"").trim();if(url&&url.indexOf("http")!==0){toast("Vul een geldige URL in (begint met http)","err");return}f.k=url||"1";rFt()}
function ftSend(pid,status,okMsg){var f=ftFind(pid);if(!f||f.busy)return;if(status==="goedgekeurd"){var chosen=String(f.k).indexOf("http")===0?f.k:(f.k==="2"?f.f2:f.k==="3"?f.f3:f.f1);if(!chosen){toast("Geen foto geselecteerd. Kies een foto of vul een URL in.","err");return}}f.busy=true;rFt();fetch(API+"/dashboard-foto-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:f.pid,keuze:f.k,status:status})}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(){f.st=status;f.busy=false;toast(okMsg);rFt();updFtBadge()}).catch(function(e){f.busy=false;toast("Opslaan mislukt: "+e.message,"err");rFt()})}
function ftApprove(pid){ftSend(pid,"goedgekeurd","Goedgekeurd — foto wordt automatisch geüpload")}
function ftSkip(pid){ftSend(pid,"overgeslagen","Overgeslagen")}
</script>
